<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - BuildWith</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .soon-wrapper {
            min-height: 100vh;
            padding-top: 80px;
        }

        .soon-container {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://placehold.co/1920x1080?text=Blueprint');
            background-size: cover;
            background-attachment: fixed;
            color: white;
            padding: 2rem;
        }

        .soon-container h1 {
            font-size: 3.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .countdown {
            display: flex;
            gap: 2rem;
            margin: 3rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .time-val {
            font-size: 3rem;
            font-weight: bold;
            display: block;
            color: var(--primary-color);
        }

        .time-label {
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: white;
        }

        @media (max-width: 600px) {
            .soon-container h1 {
                font-size: 2rem;
            }
            .time-val {
                font-size: 2rem;
            }
            .time-box {
                padding: 1rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar glass">
        <div class="container nav-container">
            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-hard-hat" style="font-size: 1.8rem; color: var(--primary-color);"></i>
                    <h2
                        style="background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin: 0;">
                        BuildWith</h2>
                </a>
            </div>

            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>

            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <span class="nav-link">Home <i class="fas fa-chevron-down" style="font-size: 0.8rem;"></i></span>
                    <ul class="dropdown-menu">
                        <li><a href="index.html" class="dropdown-item">Corporate Home</a></li>
                        <li><a href="index2.html" class="dropdown-item">Creative Home</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
                <li class="nav-item">
                    <span class="nav-link">Dashboard <i class="fas fa-chevron-down"
                            style="font-size: 0.8rem;"></i></span>
                    <ul class="dropdown-menu">
                        <li><a href="user-dashboard.html" class="dropdown-item">User Dashboard</a></li>
                        <li><a href="admin-dashboard.html" class="dropdown-item">Admin Dashboard</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
                <li class="nav-item"><a href="faq.html" class="nav-link">FAQ</a></li>
            </ul>

            <div class="nav-controls">
                <button id="rtl-toggle" class="icon-btn" title="Toggle RTL"><i class="fas fa-globe"></i></button>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme"><i class="fas fa-moon"></i></button>
                <a href="login.html" class="cta-btn" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;">Login</a>
            </div>
        </div>
    </nav>

    <div class="soon-wrapper">
        <div class="soon-container">
            <h1>Something Big is Being Built</h1>
            <p style="font-size: 1.2rem; margin-bottom: 1rem;">We are launching our new platform soon.</p>

            <div class="countdown">
                <div class="time-box">
                    <span class="time-val" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-box">
                    <span class="time-val" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
            </div>

            <form style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;" onsubmit="event.preventDefault(); alert('Subscribed!')">
                <input type="email" placeholder="Notify me..."
                    style="padding: 1rem; border-radius: 8px; border: none; width: 300px; max-width: 100%;">
                <button class="cta-btn">Subscribe</button>
            </form>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/rtl-toggle.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Set the date we're counting down to
        var countDownDate = new Date("Jan 5, 2026 15:37:25").getTime();

        // Update the count down every 1 second
        var x = setInterval(function () {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;

            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".countdown").innerHTML = "EXPIRED";
            }
        }, 1000);
    </script>
</body>

</html>
